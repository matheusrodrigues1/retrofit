org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
kotlin.code.style=official
org.gradle.daemon=true

# Configura o ambiente de compilação:
# -Xmx2048m: limita o Gradle a 2 GB de memória.
# file.encoding=UTF-8: permite a exibição correta de acentos.
# android.useAndroidX=true: habilita as bibliotecas AndroidX.
# kotlin.code.style=official: utiliza o padrão oficial de formatação do Kotlin.